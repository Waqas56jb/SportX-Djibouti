components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (HS256, ~15 min) from login/refresh. Admin routes need a token from /admin/auth/*.
    refreshCookie:
      type: apiKey
      in: cookie
      name: sportx_rt
      description: HttpOnly refresh token (storefront), path /api/v1, rotated on each use.
    adminRefreshCookie:
      type: apiKey
      in: cookie
      name: sportx_admin_rt
      description: HttpOnly refresh token (admin), path /api/v1.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
        maximum: 10000
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    DateFrom:
      name: date_from
      in: query
      schema:
        type: string
        description: ISO date-time or YYYY-MM-DD
    DateTo:
      name: date_to
      in: query
      schema:
        type: string
        description: ISO date-time or YYYY-MM-DD (inclusive end of day)
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{8,128}$
        minLength: 8
        maxLength: 128
      description: Optional. Retrying with the same key returns the original result. Malformed keys are ignored.
  responses:
    BadRequest:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: UNAUTHORIZED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentFailed:
      description: PAYMENT_FAILED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: FORBIDDEN / ACCOUNT_INACTIVE / EMAIL_NOT_VERIFIED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: CONFLICT / OUT_OF_STOCK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: INVALID_COUPON / ORDER_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Done:
      description: 'Done (data: null)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DoneEnvelope'
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 1
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
      required:
      - page
      - limit
      - total
      - totalPages
      - hasNext
      - hasPrevious
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          description: Payload (object, array or null).
        message:
          type: string
      required:
      - success
      - data
    PaginatedEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - success
      - data
      - pagination
    DoneEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          type: object
          nullable: true
        message:
          type: string
      description: 'Returned by deletions and actions without a payload (`data: null`).'
      required:
      - success
      - data
      - message
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - VALIDATION_ERROR
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CONFLICT
              - OUT_OF_STOCK
              - INVALID_COUPON
              - PAYMENT_FAILED
              - ORDER_INVALID
              - RATE_LIMITED
              - EMAIL_NOT_VERIFIED
              - ACCOUNT_INACTIVE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - INTERNAL_ERROR
            message:
              type: string
            details:
              description: Optional structured details (e.g. Zod `fieldErrors`, `issues`, `available`).
            requestId:
              type: string
          required:
          - code
          - message
      required:
      - success
      - error
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: ''''' when not set'
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - BLOCKED
        marketingOptIn:
          type: boolean
        emailVerified:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT (HS256), ~15 min
        expiresAt:
          type: string
          format: date-time
      required:
      - user
      - accessToken
      - expiresAt
    RegisterResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiresEmailVerification:
          type: boolean
      description: accessToken/expiresAt are present only when requiresEmailVerification is false.
      required:
      - user
      - requiresEmailVerification
    RoleRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    AdminIdentity:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleRef'
        permissions:
          type: array
          items:
            type: string
            example: orders:edit
    AdminSession:
      allOf:
      - $ref: '#/components/schemas/AdminIdentity'
      - type: object
        properties:
          accessToken:
            type: string
          expiresAt:
            type: string
            format: date-time
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        phone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
          nullable: true
        line1:
          type: string
          description: alias of addressLine1
        line2:
          type: string
          description: alias of addressLine2
        district:
          type: string
          nullable: true
        city:
          type: string
        country:
          type: string
        postalCode:
          type: string
          nullable: true
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AddressInput:
      type: object
      properties:
        label:
          type: string
          default: Home
          minLength: 1
          maxLength: 40
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: ^\+?[0-9\s-]{7,20}$
        addressLine1:
