# SPORTX API — OpenAPI 3.0.3. Source of truth is the code (src/modules/*/*.routes.ts, *.schema.ts, mappers); keep in sync with docs/API.md and docs/ROUTES.md.
openapi: 3.0.3
info:
  title: SPORTX API
  version: 1.0.0
  description: 'REST API for the SPORTX storefront and admin. All money values are integer DJF. Envelope: `{ success, data, message? }`; lists add `pagination`; errors
    `{ success: false, error: { code, message, details?, requestId } }`. Admin permissions are listed per operation (`x-permission`). Every /api/v1 route is also
    subject to the general limiter (300 req/min/IP). See docs/API.md for the narrative reference.'
servers:
- url: /api/v1
  description: Relative to the API origin (e.g. http://localhost:4000/api/v1)
tags:
- name: System
- name: Auth
- name: Store & shipping
- name: Catalog
- name: Account
- name: Addresses
- name: Cart
- name: Wishlist
- name: Checkout
- name: Orders
- name: Payments
- name: Coupons
- name: Reviews
- name: Notifications
- name: Support
- name: Newsletter & contact
- name: 'Admin: auth'
- name: 'Admin: orders'
- name: 'Admin: products'
- name: 'Admin: categories & brands'
- name: 'Admin: reviews'
- name: 'Admin: notifications'
- name: 'Admin: support'
- name: 'Admin: dashboard & reports'
- name: 'Admin: customers'
- name: 'Admin: inventory'
- name: 'Admin: marketing'
- name: 'Admin: shipping'
- name: 'Admin: settings'
- name: 'Admin: staff & roles'
- name: 'Admin: activity & search'
paths:
  /health:
    get:
      tags:
      - System
      summary: Health check
      description: 'Outside `/api/v1` (server root). 503 with `status: degraded` when the database is unreachable. Not rate limited.


        **Auth:** Public.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  environment:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum:
                        - up
                        - down
        '503':
          description: Database down
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  environment:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        enum:
                        - up
                        - down
      operationId: getHealth
      servers:
      - url: /
        description: Server root
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register a customer
      description: 'Sets the `sportx_rt` refresh cookie when no email verification is required.


        **Auth:** Public.


        **Rate limit:** auth — 20 / 15 min / IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 80
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type: string
                  format: email
                  maxLength: 254
                phone:
                  type: string
                  pattern: ^\+?[0-9\s-]{7,20}$
                password:
                  type: string
                  description: 8–128 characters, at least one letter and one number.
                  minLength: 8
                  maxLength: 128
                marketingOptIn:
                  type: boolean
                  default: false
              required:
              - firstName
              - lastName
              - email
              - password
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RegisterResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthRegister
  /auth/login:
    post:
      tags:
      - Auth
      summary: Customer sign-in
      description: 'Sets the HttpOnly `sportx_rt` refresh cookie (path /api/v1).


        **Auth:** Public.


        **Rate limit:** auth — 20 / 15 min / IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                remember:
                  type: boolean
                  default: true
                  description: false → session cookie
              required:
              - email
              - password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthLogin
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate refresh token → new access token
      description: 'Replaying an already-rotated token revokes all of the user''s sessions.


        **Auth:** Refresh cookie `sportx_rt`.


        **Rate limit:** auth — 20 / 15 min / IP.'
      security:
      - refreshCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthRefresh
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Sign out (revoke refresh session, clear cookie)
      description: '**Auth:** Refresh cookie `sportx_rt`.'
      security:
      - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthLogout
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Request a password-reset email
      description: 'Always succeeds (no account enumeration).


        **Auth:** Public.


        **Rate limit:** pwreset — 5 / hour / IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthForgotPassword
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Reset password with emailed token
      description: 'Revokes every session of the account.


        **Auth:** Public.


        **Rate limit:** pwreset — 5 / hour / IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 10
                  maxLength: 4096
                password:
                  type: string
                  description: 8–128 characters, at least one letter and one number.
                  minLength: 8
                  maxLength: 128
              required:
              - token
              - password
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthResetPassword
  /auth/verify-email:
    post:
      tags:
      - Auth
      summary: Confirm email address
      description: '**Auth:** Public.


        **Rate limit:** auth — 20 / 15 min / IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 10
                  maxLength: 4096
              required:
              - token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthVerifyEmail
  /auth/resend-verification:
    post:
      tags:
      - Auth
      summary: Resend verification email
      description: '**Auth:** Public.


        **Rate limit:** pwreset — 5 / hour / IP.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postAuthResendVerification
  /auth/me:
    get:
      tags:
      - Auth
      summary: Current customer
      description: '**Auth:** Customer (any valid access token).'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getAuthMe
  /store:
    get:
      tags:
      - Store & shipping
      summary: Public store configuration
      description: '**Auth:** Public.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StorePublic'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getStore
  /shipping/methods:
    get:
      tags:
      - Store & shipping
      summary: Active shipping methods
      description: '**Auth:** Public.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        freeShippingThreshold:
                          type: integer
                          description: Integer DJF
                          minimum: 0
                          nullable: true
                        currency:
                          type: string
                        methods:
                          type: array
                          items:
                            $ref: '#/components/schemas/ShippingMethod'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getShippingMethods
  /shipping/estimate:
    post:
      tags:
      - Store & shipping
      summary: Quote all methods
      description: 'Signed-in customers with a non-empty cart are quoted on their server cart (merchandiseTotal ignored).


        **Auth:** Public; a customer bearer token is used when present.'
      security:
      - {}
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                  maxLength: 80
                merchandiseTotal:
                  type: integer
                  minimum: 0
                  maximum: 100000000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        merchandiseTotal:
                          type: integer
                          description: Integer DJF
                          minimum: 0
                        options:
                          type: array
                          items:
                            $ref: '#/components/schemas/ShippingOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postShippingEstimate
  /products:
    get:
      tags:
      - Catalog
      summary: List / filter products (with facets)
      description: '`Cache-Control: public, max-age=30`.


        **Auth:** Public.'
      security: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 10000
      - name: limit
        in: query
        schema:
          type: integer
          default: 12
          minimum: 1
          maximum: 48
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
        description: alias of limit
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
      - name: collection
        in: query
        schema:
          type: string
          maxLength: 80
        description: shop, men, women, kids, football, basketball, running, training, equipment, new-arrivals, sale, footwear, apparel, accessories, balls, bags,
          gym-equipment
      - name: category
        in: query
        schema:
          type: string
        description: comma list or repeated; `categorys` also accepted
      - name: brand
        in: query
        schema:
          type: string
        description: comma list or repeated; `brands` also accepted
      - name: gender
        in: query
        schema:
          type: string
        description: comma list or repeated; `genders` also accepted
      - name: sport
        in: query
        schema:
          type: string
        description: comma list or repeated; `sports` also accepted
      - name: size
        in: query
        schema:
          type: string
        description: comma list or repeated; `sizes` also accepted
      - name: color
        in: query
        schema:
          type: string
        description: comma list or repeated; `colors` also accepted
      - name: minPrice
        in: query
        schema:
          type: integer
          minimum: 0
      - name: maxPrice
        in: query
        schema:
          type: integer
          minimum: 0
      - name: minRating
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: inStock
        in: query
        schema:
          type: boolean
      - name: inStockOnly
        in: query
        schema:
          type: boolean
      - name: availability
        in: query
        schema:
          type: string
          enum:
          - in_stock
          - out_of_stock
          - all
      - name: sale
        in: query
        schema:
          type: boolean
      - name: new
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - featured
          - newest
          - price_asc
          - price_desc
          - rating
          - popular
          - relevance
        description: '`price-asc` style also accepted'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getProducts
  /products/search:
    get:
      tags:
      - Catalog
      summary: Search products
      description: 'Same filters as /products; `q` is required (400 otherwise). Response also echoes `query`.


        **Auth:** Public.'
      security: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
          maximum: 10000
      - name: limit
        in: query
        schema:
          type: integer
          default: 12
          minimum: 1
          maximum: 48
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 48
        description: alias of limit
      - name: q
        in: query
        schema:
          type: string
          maxLength: 120
        required: true
      - name: collection
        in: query
        schema:
          type: string
          maxLength: 80
        description: shop, men, women, kids, football, basketball, running, training, equipment, new-arrivals, sale, footwear, apparel, accessories, balls, bags,
          gym-equipment
      - name: category
        in: query
        schema:
          type: string
        description: comma list or repeated; `categorys` also accepted
      - name: brand
        in: query
        schema:
          type: string
        description: comma list or repeated; `brands` also accepted
      - name: gender
        in: query
        schema:
          type: string
        description: comma list or repeated; `genders` also accepted
      - name: sport
        in: query
        schema:
          type: string
        description: comma list or repeated; `sports` also accepted
      - name: size
        in: query
        schema:
          type: string
        description: comma list or repeated; `sizes` also accepted
      - name: color
        in: query
        schema:
          type: string
        description: comma list or repeated; `colors` also accepted
      - name: minPrice
        in: query
        schema:
          type: integer
          minimum: 0
      - name: maxPrice
        in: query
        schema:
          type: integer
          minimum: 0
      - name: minRating
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 5
      - name: inStock
        in: query
        schema:
          type: boolean
      - name: inStockOnly
        in: query
        schema:
          type: boolean
      - name: availability
        in: query
        schema:
          type: string
          enum:
          - in_stock
          - out_of_stock
          - all
      - name: sale
        in: query
        schema:
          type: boolean
      - name: new
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - featured
          - newest
          - price_asc
          - price_desc
          - rating
          - popular
          - relevance
        description: '`price-asc` style also accepted'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getProductsSearch
  /products/featured:
    get:
      tags:
      - Catalog
      summary: Featured product rails
      description: '**Auth:** Public.'
      security: []
      parameters:
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - new
          - bestseller
          - sale
          - training
          - football
          - basketball
          - running
          - featured
          default: featured
      - name: limit
        in: query
        schema:
          type: integer
          default: 8
          minimum: 1
          maximum: 48
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getProductsFeatured
  /products/batch:
    get:
      tags:
      - Catalog
      summary: Products by ids/slugs (wishlist, recently viewed)
      description: 'At most 60 in total; unknown/unpublished are skipped; requested order kept.


        **Auth:** Public.'
      security: []
      parameters:
      - name: ids
        in: query
        schema:
          type: string
        description: comma list of UUIDs
      - name: slugs
        in: query
        schema:
          type: string
        description: comma list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getProductsBatch
  /products/{id}/reviews:
    get:
      tags:
      - Catalog
      summary: Approved reviews of a product
      description: 'Pagination is returned inside `data.pagination` (not the paginated envelope).


        **Auth:** Public.'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Product UUID or slug
          minLength: 1
          maxLength: 160
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - newest
          - highest
          - lowest
          - helpful
          default: newest
      - name: rating
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductReviews'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getProductsIdReviews
    post:
      tags:
      - Catalog
      summary: Write a review
      description: 'Only customers with a DELIVERED order containing the product; one review per product; starts PENDING.


        **Auth:** Customer (any valid access token).


        **Rate limit:** review — 10 / hour / IP.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Product UUID or slug
          minLength: 1
          maxLength: 160
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                title:
                  type: string
                  minLength: 2
                  maxLength: 120
                comment:
                  type: string
                  description: '`body` accepted as alias'
                  minLength: 10
                  maxLength: 2000
                fit:
                  type: string
                  enum:
                  - small
                  - 'true'
                  - large
                  nullable: true
                size:
                  type: string
                  maxLength: 20
                  nullable: true
              required:
              - rating
              - title
              - comment
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/OwnReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: postProductsIdReviews
  /products/{idOrSlug}/related:
    get:
      tags:
      - Catalog
      summary: Related products
      description: '**Auth:** Public.'
      security: []
      parameters:
      - name: idOrSlug
        in: path
        required: true
        schema:
          type: string
          description: Product UUID or slug
          minLength: 1
          maxLength: 160
      - name: limit
        in: query
        schema:
          type: integer
          default: 8
