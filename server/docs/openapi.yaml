              type: object
              properties:
                subject:
                  type: string
                  minLength: 3
                  maxLength: 160
                category:
                  type: string
                  enum:
                  - ORDER
                  - DELIVERY
                  - RETURNS
                  - PAYMENT
                  - PRODUCT
                  - ACCOUNT
                  - OTHER
                  default: OTHER
                  description: case-insensitive; RETURN → RETURNS
                orderNumber:
