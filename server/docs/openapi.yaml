      - lastName
      - phone
      - addressLine1
      - city
    AddressPatch:
      type: object
      properties:
        label:
          type: string
          default: Home
          minLength: 1
          maxLength: 40
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: ^\+?[0-9\s-]{7,20}$
        addressLine1:
          type: string
          description: '`line1` accepted as alias'
          minLength: 3
          maxLength: 200
        addressLine2:
          type: string
          description: '`line2` accepted as alias'
          maxLength: 200
          nullable: true
        district:
          type: string
          maxLength: 80
          nullable: true
        city:
          type: string
          minLength: 2
          maxLength: 80
        country:
          type: string
          default: Djibouti
          minLength: 2
          maxLength: 80
