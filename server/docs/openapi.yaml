          minLength: 3
          maxLength: 200
        addressLine2:
          type: string
          description: '`line2` accepted as alias'
          maxLength: 200
          nullable: true
        district:
          type: string
          maxLength: 80
          nullable: true
        city:
          type: string
          minLength: 2
          maxLength: 80
        country:
          type: string
          default: Djibouti
          minLength: 2
          maxLength: 80
        postalCode:
          type: string
